name: JavaScript checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Test
        run: npm test -- --runInBand --watch=false --silent
      - name: Lint
        run: npm run lint -- --quiet
